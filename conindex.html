<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World - AI & Health Support</title>
  <style>
    /* CSS Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333333;
    }

    .container {
      background: #ffffff;
      padding: 2.5rem 3rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    h1 {
      color: #10b981; /* ヘルシーなグリーン */
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: #64748b;
      font-size: 1rem;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 1rem;
      background-color: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon">🌿🤖</div>
    <h1>Hello, World!</h1>
    <p>AI × Real Shop Health Support Service</p>
    <div class="badge">Healthy & Energetic Life</div>
  </div>

</body>
</html>
